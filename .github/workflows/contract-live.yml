name: Live contract check
# Replays the six synthetic invoices against production and compares verdicts and
# blocking rules with examples/attendus.json. Needs the MAFACTUREOK_CLE secret
# (a key issued to the project address). Six validations a week, well under quota.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/live-check.mjs
        env:
          MAFACTUREOK_CLE: ${{ secrets.MAFACTUREOK_CLE }}
